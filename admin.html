<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dealzy Admin Dashboard</title><link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
<div id="login" class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="index.html"><span>DEAL</span>ZY</a>
    <h1>Admin Dashboard</h1><p>Secure store management</p>
    <form id="loginForm">
      <input id="username" placeholder="Username" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn primary full">Login</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </div>
</div>
<div id="dashboard" class="dashboard hidden">
  <aside class="sidebar">
    <a class="brand" href="index.html"><span>DEAL</span>ZY</a>
    <button class="side active" data-view="productsView">Products</button>
    <button class="side" data-view="blogView">Blog</button>
    <button id="logout" class="side">Logout</button>
  </aside>
  <section class="dash-main">
    <div class="dash-top"><div><span class="eyebrow">CONTROL CENTER</span><h1>Store Dashboard</h1></div><a class="btn glass" href="index.html">View Store</a></div>
    <div id="productsView" class="view">
      <div class="panel"><div class="panel-head"><h2>Products</h2><button id="newProduct" class="btn primary">+ Add Product</button></div><div id="productTable" class="table"></div></div>
      <div id="productEditor" class="panel hidden"><h2 id="editorTitle">Add Product</h2><form id="productForm" class="form-grid">
        <input type="hidden" id="productId"><input id="pName" placeholder="Product name" required><input id="pCategory" placeholder="Category" required>
        <input id="pPrice" type="number" step="0.01" placeholder="Price"><input id="pOldPrice" type="number" step="0.01" placeholder="Old price">
        <input id="pImage" placeholder="Image URL"><input id="pRating" type="number" step="0.1" min="0" max="5" placeholder="Rating">
        <input id="pAmazon" placeholder="Amazon affiliate URL" required><textarea id="pDescription" placeholder="Description"></textarea>
        <div><button class="btn primary">Save</button> <button type="button" id="cancelProduct" class="btn glass">Cancel</button></div>
      </form></div>
    </div>
    <div id="blogView" class="view hidden">
      <div class="panel"><div class="panel-head"><h2>Blog Posts</h2><button id="newPost" class="btn primary">+ Add Post</button></div><div id="postTable" class="table"></div></div>
      <div id="postEditor" class="panel hidden"><h2>Blog Editor</h2><form id="postForm">
        <input type="hidden" id="postId"><input id="postTitle" placeholder="Title" required><input id="postSlug" placeholder="Slug" required><textarea id="postContent" placeholder="Content" rows="10" required></textarea>
        <button class="btn primary">Save Post</button> <button type="button" id="cancelPost" class="btn glass">Cancel</button>
      </form></div>
    </div>
  </section>
</div>
<script>window.DEALZY_API="https://YOUR-RENDER-SERVICE.onrender.com/api";</script>
<script src="admin.js"></script>
</body>
</html>
